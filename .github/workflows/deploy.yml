name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCyWjLau2j3nk6Apm3rvWG0HakSYxRM8gk
          VITE_FIREBASE_AUTH_DOMAIN: battleroyaleirl.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: battleroyaleirl
          VITE_FIREBASE_STORAGE_BUCKET: battleroyaleirl.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "949607952294"
          VITE_FIREBASE_APP_ID: "1:949607952294:web:97ce6789a6c414db556967"
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
